name: Docker Build & Image Verification

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  docker-verify:
    name: Build & Validate Docker Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Web Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: rishabh-store/web:latest

      - name: Build Server Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: rishabh-store/server:latest

      - name: Verify Docker Compose Configuration
        run: docker compose config
