version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rishabh_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - store_network
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: rishabh_server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - store_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rishabh_web
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - store_network

networks:
  store_network:
    driver: bridge

volumes:
  redis_data:
