version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rishabh_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-prod_redis_pass_2026}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - store_prod_network
    volumes:
      - redis_prod_data:/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: rishabh_server_prod
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-prod_redis_pass_2026}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - store_prod_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rishabh_web_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    networks:
      - store_prod_network

networks:
  store_prod_network:
    driver: bridge

volumes:
  redis_prod_data:
